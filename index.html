<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XYZW 游戏管理系统</title>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <style>
      /* 首屏样式：只服务于「应用挂载前」的那一帧。
         颜色与 src/assets/styles/tokens.scss 保持同一组值（不用紫靛渐变）。 */
      :root {
        --boot-bg: #e9edf2;
        --boot-text: #14181f;
        --boot-muted: #5f6975;
        --boot-accent: #2b54d4;
      }

      html[data-theme="dark"],
      html.dark {
        --boot-bg: #0d0f13;
        --boot-text: #e9ecf2;
        --boot-muted: #8f99a8;
        --boot-accent: #7a97f0;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue",
          Helvetica, Arial, sans-serif;
        background: var(--boot-bg);
        color: var(--boot-text);
        min-height: 100vh;
      }

      #app {
        min-height: 100vh;
      }

      .loading {
        display: flex;
        gap: 12px;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: var(--boot-muted);
        font-size: 15px;
        letter-spacing: 0.01em;
      }

      .loading::before {
        content: "";
        width: 16px;
        height: 16px;
        border: 2px solid currentColor;
        border-top-color: var(--boot-accent);
        border-radius: 50%;
        animation: boot-spin 900ms linear infinite;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .loading::before {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="loading">正在加载应用...</div>
    </div>
    <script type="module" src="/src/main.js"></script>
    <!--
      游戏运行时（src/xyzw/**，约 4 MB）不再挂在首屏：
      改由 src/utils/gameRuntime.js 在 Token 管理页按需注入，
      构建时 vite.config.js 的 emit-game-runtime 插件会把它原样拷到 dist/game-runtime/。
    -->
  </body>
</html>
