# .github/workflows/verify.yml
#
# 提交闸门。两个 job：
#   frontend —— 架构契约(--strict) + lint(零警告) + 单测 + 生产构建 + 产物预算
#   backend  —— 起 Postgres service，跑 API/加密/执行器/存储同步测试
#
# 拆开的原因：前端 job 必须永远快且稳定；后端 job 依赖数据库，
# 失败时能立刻看出是「契约/lint」的问题还是「后端逻辑」的问题。
#
# 注意：推送 .github/workflows/** 需要 token 具备 `workflow` scope。
# 若 push 被 GitHub 拒绝（refusing to allow a Personal Access Token to create or update
# workflow files），先 `gh auth refresh -s workflow`，或在 GitHub 网页端粘贴本文件。
# 本地等价命令：`node scripts/verify-all.mjs`（见 scripts/verify-all.mjs）。

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 契约 + lint + 单测 + 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # --strict：新增能力也必须先进基线，否则基线会一路落后于代码
      - name: 架构契约
        run: pnpm run check:arch:strict

      - name: Lint（零警告，含 backend/）
        run: pnpm run lint

      # 类型检查此前完全没跑过：117 个错误躺在 tokenStore/cache/token.ts 里没人知道
      - name: 类型检查
        run: pnpm run typecheck

      # 含存储单通道门禁（storageChannel）与前后端协议一致性（protocolParity）
      - name: 单测
        run: pnpm test

      - name: 生产构建
        run: pnpm run build

      - name: 产物体积基线
        run: pnpm run check:bundle

  backend:
    name: 后端测试（含 Postgres）
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xyzw
          POSTGRES_PASSWORD: xyzw_dev_pw
          POSTGRES_DB: xyzw
          TZ: Asia/Shanghai
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U xyzw -d xyzw"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://xyzw:xyzw_dev_pw@127.0.0.1:55432/xyzw
      API_KEY: dev-api-key
      # 固定测试密钥，仅用于 CI；生产请用 KMS 或独立 secret
      TOKEN_MASTER_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
      TOKEN_KEY_ID: test-k1
      MAX_CONCURRENT_TOKENS: "2"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # backend/ 已在 pnpm-workspace.yaml 内，根目录一次 install 装好两边。
      # 注意：两个 job 是独立 runner，前端 job 的 install 不会传导到这里 ——
      # CI 首次真实运行就是因为漏了这步而失败（node_modules missing）。
      - name: 安装依赖（workspace）
        run: pnpm install --frozen-lockfile

      - name: 建表
        run: |
          for f in backend/sql/*.sql; do
            echo "applying $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
        env:
          PGPASSWORD: xyzw_dev_pw

      - name: 后端单测
        run: pnpm run test:backend
