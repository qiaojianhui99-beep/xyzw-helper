# deploy/docker-compose.stack.yml
# 完整栈：前端静态站点 + API + Worker + Postgres。
#
#   cp .env.example .env          # 填 DATABASE_URL / API_KEY / TOKEN_MASTER_KEY
#   docker compose -f deploy/docker-compose.stack.yml up -d --build
#   curl http://localhost:8080/health      # 由 nginx 反代到 api
#
# 与 deploy/docker-compose.yml 的关系：那份只跑 web + proxy（纯静态托管），
# 这份是「前后端一起」的完整栈。两者可共存，按需选一份。
#
# 关于 DATABASE_URL 的端口：
#   - 自建 Postgres（本文件 db 服务）→ 5432，advisory lock 正常
#   - Supabase transaction pooler    → 6543，**会话级 advisory lock 会失效**，
#     worker 必须改用 5432（session pooler / 直连）
#   worker 启动时会主动探测并告警，不会静默降级。

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: xyzw-web-helper:latest
    container_name: xyzw-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: xyzw-backend:latest
    container_name: xyzw-api
    restart: unless-stopped
    command: ["node", "src/api/app.js"]
    environment:
      NODE_ENV: production
      PORT: "3002"
      HOST: "0.0.0.0"
      DATABASE_URL: ${DATABASE_URL:-postgresql://xyzw:xyzw_dev_pw@db:5432/xyzw}
      API_KEY: ${API_KEY:?必须设置 API_KEY}
      TOKEN_MASTER_KEY: ${TOKEN_MASTER_KEY:?必须设置 TOKEN_MASTER_KEY（32 字节 base64）}
      TOKEN_KEY_ID: ${TOKEN_KEY_ID:-k1}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      LOG_MAX: ${LOG_MAX:-500}
    expose:
      - "3002"
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: xyzw-backend:latest
    container_name: xyzw-worker
    restart: unless-stopped
    command: ["node", "src/worker/main.js"]
    # 单实例：cron 不能重复执行。advisory lock 是第二道保险。
    deploy:
      replicas: 1
    environment:
      NODE_ENV: production
      # worker 直连 5432 —— transaction pooler 会让会话级 advisory lock 失效
      DATABASE_URL: ${WORKER_DATABASE_URL:-postgresql://xyzw:xyzw_dev_pw@db:5432/xyzw}
      TOKEN_MASTER_KEY: ${TOKEN_MASTER_KEY:?必须设置 TOKEN_MASTER_KEY（32 字节 base64）}
      TOKEN_KEY_ID: ${TOKEN_KEY_ID:-k1}
      DB_POOL_MAX: ${WORKER_DB_POOL_MAX:-5}
      MAX_CONCURRENT_TOKENS: ${MAX_CONCURRENT_TOKENS:-2}
    depends_on:
      db:
        condition: service_healthy
    # 优雅关闭：给正在执行的任务 30 秒收尾
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    container_name: xyzw-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xyzw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xyzw_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-xyzw}
      TZ: Asia/Shanghai
    volumes:
      - xyzw_pgdata:/var/lib/postgresql/data
      # 首次启动自动执行 001/002 建表
      - ../backend/sql:/docker-entrypoint-initdb.d:ro
    # 不对外暴露端口；需要外部访问时再加 "55432:5432"
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xyzw} -d ${POSTGRES_DB:-xyzw}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  xyzw_pgdata:
