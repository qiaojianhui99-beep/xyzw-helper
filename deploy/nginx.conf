# ============================================================================
# XYZW Web Helper —— 生产站点配置（nginx）
#
# 用法（二选一）：
#   1) Docker：本文件被 Dockerfile 复制到 /etc/nginx/conf.d/default.conf，
#      静态产物在 /app/web，开箱即用。
#   2) 裸机：deploy/remote-install.sh 会把下面所有 /app/web 替换成实际
#      WEB_ROOT（默认 /var/www/xyzw）后写入 /etc/nginx/conf.d/xyzw.conf。
#
# 关键点：vite.config.js 里的 server.proxy 只在 dev 生效。手机上号登录、
# 微信扫码登录这几条 /api/* 必须由 nginx 反向代理，否则线上这几条功能全部 404。
# ============================================================================

server {
    listen      80;
    listen [::]:80;
    server_name _;

    # 后端 API 上游。Docker 内置 DNS（127.0.0.11）在请求时解析 `api`，
    # 裸机部署可改成 127.0.0.1:3002 —— 两处都只改这一行。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $xyzw_api_upstream http://api:3002;

    root  /app/web;
    index index.html;

    charset utf-8;
    server_tokens off;
    client_max_body_size 20m;

    # ------------------------------------------------------------------
    # 压缩：npm run build 会为 >1KB 的 js/css/html 预生成 .gz 与 .br，
    # gzip_static 直接吐现成的压缩体，省掉每次请求的压缩 CPU。
    # 想用 brotli 需装 ngx_brotli，并在 http {} 里打开 brotli_static on;
    # ------------------------------------------------------------------
    gzip              on;
    gzip_static       on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/wasm
        image/svg+xml
        font/ttf
        font/woff
        font/woff2;

    # ------------------------------------------------------------------
    # 缓存策略：带 hash 的产物长缓存，index.html 永不缓存
    # ------------------------------------------------------------------
    # 只用 add_header，不叠加 expires，否则会下发两个 Cache-Control
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files  $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 游戏运行时（cc + __require 模块表）按需加载，文件名不带 hash：
    # 缓存给短一点，靠 ETag 协商，更新产物后客户端下次进入 Token 页就会拿到新版。
    location /game-runtime/ {
        add_header Cache-Control "public, max-age=3600";
        access_log off;
        try_files  $uri =404;
    }

    # ------------------------------------------------------------------
    # SPA 路由回退（Vue Router history 模式必需）
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏文件、Cloudflare 专用 worker 脚本不对外
    location ~ /\.(?!well-known) {
        deny all;
    }
    location = /_worker.js {
        return 404;
    }

    # ------------------------------------------------------------------
    # 游戏登录反代 —— 与 vite.config.js server.proxy 严格一一对应
    # 顺序按前缀长度从长到短，避免 /api/weixin 抢走 /api/weixin-long
    # ------------------------------------------------------------------

    # /api/hortor-ucenter/*  ->  comb-platform.hortorgames.com/*
    # 注意：TLS 握手目标是 comb-platform，但 Host 头写 ucenter-app-server，
    #       所以 proxy_ssl_name 必须显式指定，不能用默认（默认会取 Host）。
    location /api/hortor-ucenter {
        rewrite ^/api/hortor-ucenter/?(.*)$ /$1 break;
        proxy_pass https://comb-platform.hortorgames.com;

        proxy_http_version 1.1;
        proxy_set_header Host   ucenter-app-server.hortorgames.com;
        proxy_set_header Accept "application/json";
        proxy_set_header Content-Type "application/json; charset=utf-8";
        proxy_set_header User-Agent "Mozilla/5.0 (Linux; Android 12; ALN-AL80 Build/HUAWEIALN-AL80; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/114.0.5735.196 Mobile Safari/537.36";

        proxy_ssl_server_name on;
        proxy_ssl_name        comb-platform.hortorgames.com;
        proxy_ssl_verify      off;

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # /api/hortor/*  ->  comb-platform.hortorgames.com/*
    location /api/hortor {
        rewrite ^/api/hortor/?(.*)$ /$1 break;
        proxy_pass https://comb-platform.hortorgames.com;

        proxy_http_version 1.1;
        proxy_set_header Host        comb-platform.hortorgames.com;
        proxy_set_header Connection  "keep-alive";
        proxy_set_header Content-Type "text/plain; charset=utf-8";
        proxy_set_header Origin      "https://open.weixin.qq.com";
        proxy_set_header Referer     "https://open.weixin.qq.com/";
        proxy_set_header Accept      "*/*";
        proxy_set_header User-Agent  "Mozilla/5.0 (Linux; Android 12; 23117RK66C Build/V417IR; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/95.0.4638.74 Mobile Safari/537.36";

        proxy_ssl_server_name on;
        proxy_ssl_name        comb-platform.hortorgames.com;
        proxy_ssl_verify      off;

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # /api/weixin-long/*  ->  long.open.weixin.qq.com/*（扫码状态长轮询）
    location /api/weixin-long {
        rewrite ^/api/weixin-long/?(.*)$ /$1 break;
        proxy_pass https://long.open.weixin.qq.com;

        proxy_http_version 1.1;
        proxy_set_header Host      long.open.weixin.qq.com;
        proxy_set_header Accept    "*/*";
        proxy_set_header Referer   "https://open.weixin.qq.com/";
        proxy_set_header User-Agent "Mozilla/5.0 (Linux; Android 7.0; Mi-4c Build/NRD90M; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/53.0.2785.49 Mobile MQQBrowser/6.2 TBS/043632 Safari/537.36 MicroMessenger/6.6.1.1220(0x26060135) NetType/WIFI Language/zh_CN";

        proxy_ssl_server_name on;
        proxy_ssl_name        long.open.weixin.qq.com;
        proxy_ssl_verify      off;

        # 长轮询：不能缓冲，读超时给足
        proxy_buffering        off;
        proxy_cache            off;
        proxy_connect_timeout  10s;
        proxy_read_timeout     120s;
        proxy_send_timeout     120s;
    }

    # /api/weixin/*  ->  open.weixin.qq.com/*（扫码页 / qrconnect）
    location /api/weixin {
        rewrite ^/api/weixin/?(.*)$ /$1 break;
        proxy_pass https://open.weixin.qq.com;

        proxy_http_version 1.1;
        proxy_set_header Host      open.weixin.qq.com;
        proxy_set_header Accept    "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8";
        proxy_set_header Referer   "https://open.weixin.qq.com/";
        proxy_set_header User-Agent "Mozilla/5.0 (Linux; Android 7.0; Mi-4c Build/NRD90M; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/53.0.2785.49 Mobile MQQBrowser/6.2 TBS/043632 Safari/537.36 MicroMessenger/6.6.1.1220(0x26060135) NetType/WIFI Language/zh_CN";

        proxy_ssl_server_name on;
        proxy_ssl_name        open.weixin.qq.com;
        proxy_ssl_verify      off;

        # 上游返回 302 时把 Location 里的绝对地址改写回同源，否则浏览器会跨域
        proxy_redirect https://open.weixin.qq.com/ /api/weixin/;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # ------------------------------------------------------------------
    # /api/proxy?url=...  —— 通用跨域取数（“URL 导入 / 一键刷新 Token”用）
    #
    # 前端传的是 encodeURIComponent(源地址)，nginx 的 $arg_url 不解码，
    # 直接变量 proxy_pass 会拿到 "https%3A%2F%2F..." 并报 invalid URL prefix。
    # 所以原样转给 deploy/proxy-service/server.mjs（本机 3001），由它解码、
    # 校验、拉取。该进程没起时这里返回 502，不影响其余功能。
    # ------------------------------------------------------------------
    location = /api/proxy {
        limit_except GET { deny all; }

        proxy_http_version 1.1;
        proxy_set_header Host       127.0.0.1;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering       off;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_pass http://127.0.0.1:3001;
    }

    # ------------------------------------------------------------------
    # 后端业务 API（Fastify，见 backend/）
    #
    # 匹配优先级说明：nginx 前缀匹配取最长者。
    #   /api/hortor-ucenter、/api/hortor、/api/weixin-long、/api/weixin
    #   = /api/proxy
    # 都比 /api/ 更长或更精确，因此会先命中各自的 location，不会被这条吞掉。
    #
    # 为什么用变量 + resolver 而不是写死 proxy_pass http://api:3002：
    #   纯静态部署（deploy/docker-compose.yml）里没有 api 容器，
    #   写死会让 nginx 启动时报 "host not found in upstream" 直接起不来。
    #   用变量后 DNS 在请求时解析，缺 api 时只返回 502。
    # ------------------------------------------------------------------
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        # 手动触发任务后，服务端是异步执行，这里只需要等 HTTP 响应本身
        proxy_read_timeout    120s;
        proxy_pass $xyzw_api_upstream;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
